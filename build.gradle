plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {

	maven { url 'https://repo.hypixel.net/repository/Hypixel/' }
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"aerial" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	test {
		// Inherit the client compile/runtime classpath wholesale: loom injects the remapped
		// `minecraft` artifact into it, and extendsFrom on the configuration would not pick that up.
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output + sourceSets.main.output
	}
}

dependencies {

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "net.hypixel:mod-api:1.0.2"
	include "net.hypixel:mod-api:1.0.2"

	// Nashorn JavaScript engine for scripting support (built into Java, no classloader conflicts)
	implementation "org.openjdk.nashorn:nashorn-core:15.4"

	// LuaJ: lightweight pure-Java Lua interpreter for the advanced script editor (no native libs)
	implementation "org.luaj:luaj-jse:3.0.1"

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

// Prints the client compile classpath so a single package can be type-checked with plain javac,
// which takes seconds against a warm `build/classes` instead of a full Gradle run.
tasks.register('printClientClasspath') {
	doLast { println sourceSets.client.compileClasspath.asPath }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {

	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {

	}
}
